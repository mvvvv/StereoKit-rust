# Gradle optimization
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# SDK versions
android.compileSdkVersion=33
android.targetSdkVersion=33
android.minSdkVersion=29

# Cargo/Rust settings
cargo.targets=arm64
cargo.libname=${CARGO_LIBNAME}
# OpenXR loader: use-that-of-the-device | build-dynamic-openxr | <path_to_loader>
cargo.openxr=build-dynamic-openxr

# Application settings
android.appname=${APP_NAME}
android.applicationId=${APPLICATION_ID}
android.main=${APPLICATION_ID}.MainActivity
android.versionCode=1
android.versionName=0.1.0

# ADB port mapping
adb.portFrom=tcp:8080
adb.portTo=tcp:8080

# Keystore for release signing — store these in ~/.gradle/gradle.properties
# RELEASE_STORE_FILE=/path/to/my_release_key.keystore
# RELEASE_STORE_PASSWORD=password
# RELEASE_KEY_ALIAS=alias_name
# RELEASE_KEY_PASSWORD=key_password
