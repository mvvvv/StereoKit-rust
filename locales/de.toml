date_months_ago = "vor %{count} Monaten"
date_years_ago = "vor %{count} Jahren"
date_future = "Zukunft"

# --- preview panel (BasicPreviewer) ---
kind_unreadable = "Art: Eintrag nicht lesbar!"
kind_symlink = "Art: symbolischer Link -> %{target}"
kind_symlink_dir = "Art: symbolischer Link -> %{target} (Verzeichnis)"
kind_directory = "Art: Verzeichnis (%{count} Element(e))"
kind_file = "Art: Datei (%{ext})"
size_line = "Größe: %{size}"
modified_line = "Geändert: %{date}"
access_line = "Zugriff: %{access}"
read_only = "schreibgeschützt"
read_write = "Lesen/Schreiben"
path_label = "Pfad:"
