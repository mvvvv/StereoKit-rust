# Deutscher Katalog der Crate-Tools (siehe `locales/en.toml` für die vollständige Schlüsselliste).
# Zur Laufzeit wählbar mit `stereokit_rust::tools::file_browser_b::set_locale("de")`.

[file_browser_b]
# --- window titles (one per PickerMode) ---
title_open = "Datei öffnen"
title_open_multi = "Mehrere Dateien öffnen"
title_select = "Datei auswählen"
title_select_multi = "Mehrere Dateien auswählen"
title_save = "Datei erstellen"
title_select_dir = "Verzeichnis auswählen"
title_delete_file = "Datei löschen"
title_delete_file_multi = "Mehrere Dateien löschen"
title_delete_dir = "Verzeichnis löschen"
all_file_types = "Alle Dateitypen"
only_exts = "Nur (%{exts})"

# --- toolbar / new folder / search / sort bar ---
new_folder = "Neuer Ordner"
new_folder_prompt = "Neuer Ordner:"
create = "erstellen"
cancel = "abbrechen"
cannot_create_folder = "Ordner kann nicht erstellt werden: %{error}"
search = "suchen:"
clear = "leeren"
hidden = "versteckt"
sort_name = "Name"
sort_size = "Größe"
sort_date = "Datum"
sort_type = "Typ"

# --- errors and entry annotations ---
error_dir_not_found = "Fehler: Verzeichnis existiert nicht!"
error_cell = "Fehler!"
