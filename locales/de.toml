confirm_recursive_deletion = "Rekursives Löschen bestätigen"
no_file_verb = "keine Datei %{verb}"
files_verb = "%{count} Dateien %{verb}"
verb_selected = "ausgewählt"
verb_to_delete = "zu löschen"

# --- status line ---
status_line = "%{dirs} Ordner, %{files} Dateien%{size}  —  %{sort}"

# --- sizes / dates (format_size / format_date) ---
size_bytes = "%{size} B"
