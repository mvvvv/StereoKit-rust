# 本 crate 工具的中文（简体）翻译目录（完整键列表见 `locales/en.toml`）。
# 运行时可使用 `stereokit_rust::tools::locales::set_locale("zh")` 切换。
[locales]
language = "中文"
country = ""

[file_browser_b]
# --- window titles (one per PickerMode) ---
title_open = "打开文件"
title_open_multi = "打开多个文件"
title_select = "选择文件"
