new_folder_prompt = "新建文件夹："
create = "创建"
cancel = "取消"
cannot_create_folder = "无法创建文件夹：%{error}"
search = "搜索："
clear = "清除"
hidden = "隐藏"
sort_name = "名称"
sort_size = "大小"
sort_date = "日期"
sort_type = "类型"

# --- errors and entry annotations ---
