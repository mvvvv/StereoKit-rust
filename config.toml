[env]
# Set ENV_VAR_NAME=value for any process run by Cargo
SK_RUST_ASSETS_DIR = "assets"
SK_RUST_SHADERS_SOURCE_DIR = "shaders_src"
SK_RUST_SHADERS_SKS_DIR = "shaders"

# StereoKitC is built with GCC's slim LTO (-flto), which produces objects
# containing only GIMPLE IR (no x86-64 machine code). rust-lld cannot process
# GCC GIMPLE IR. Using gcc as the linker driver causes it to automatically pass
# liblto_plugin.so to ld.bfd, which can then compile the IR at link time.
[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
