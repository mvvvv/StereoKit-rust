name: Build and test
on: 
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        required: false
      onWindows:
        description: 'on windows latest!'
        type: boolean
        required: false
        default: true
      onUbuntu:
          description: 'on ubuntu latest!'
          type: boolean
          required: false
          default: true
      onMacOS:
          description: 'on macos latest!'
          type: boolean
          required: false
          default: true


permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true
  RUST_BACKTRACE: 1

jobs:

  build-windows:
    runs-on: windows-latest
    if: ${{ inputs.onWindows }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch || github.ref }}
        submodules: 'recursive'

    - uses: lukka/get-cmake@v3.26.3

    - name: Get Cache
      uses: swatinem/rust-cache@v2

    - name: Install StereoKit
      run: cargo install -F event-loop --force --path . 

    - name: compile shaders
      run: cargo compile_sks --options -f -t s

    # - name: Build event-loop
    #   run: cargo build --verbose --features event-loop --example main_pc
    # - name: Run tests event-loop
    #   run: cargo test --verbose --features event-loop -- --test-threads=1

    - name: Build no-event-loop
      run: cargo build --verbose --features no-event-loop --example manual
    - name: Run tests no-event-loop
      run: cargo test --verbose --features no-event-loop -- --test-threads=1

  build-linux:
    runs-on: ubuntu-latest
    if: ${{ inputs.onUbuntu }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch || github.ref }}
        submodules: 'recursive'

    - name: Get Cache
      uses: swatinem/rust-cache@v2

    - name: Install Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install xvfb clang cmake lld ninja-build libx11-dev libxfixes-dev libvulkan-dev libfontconfig-dev libxkbcommon-x11-0 libxkbcommon0 libxrandr-dev libxcursor-dev libwayland-dev wayland-protocols libxkbcommon-dev mesa-vulkan-drivers libx11-xcb1 libxcb-dri3-0

    - name: Install StereoKit
      run: cargo install -F event-loop --force --path . 

    - name: compile shaders
      run: cargo compile_sks --options -f -t s

    # - name: Build event-loop
    #   run: cargo build --verbose --features event-loop --example main_pc
    # - name: Run tests event-loop
    #   run: |
    #     export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    #     xvfb-run --auto-servernum -s "-screen 0 1280x1024x16" cargo test --verbose --features event-loop -- --test-threads=1

    - name: Build no-event-loop
      run: cargo build --verbose --features no-event-loop --example manual
    - name: Run tests no-event-loop
      run: |
        export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        xvfb-run --auto-servernum -s "-screen 0 1280x1024x16" cargo test --verbose --features no-event-loop -- --test-threads=1

  build-macos:
    runs-on: macos-latest
    if: ${{ inputs.onMacOS }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch || github.ref }}
        submodules: 'recursive'

    - name: Get Cache
      uses: swatinem/rust-cache@v2

    - name: Install Prerequisites
      run: |
        brew install cmake ninja molten-vk vulkan-headers

    - name: Install StereoKit
      run: cargo install -F event-loop --force --path . 

    - name: compile shaders
      run: cargo compile_sks --options -f -t s

    # - name: Build event-loop
    #   run: cargo build --verbose --features event-loop --example main_pc
    # - name: Run tests event-loop
    #   run: |
    #     export DYLD_LIBRARY_PATH=$(brew --prefix molten-vk)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}
    #     export VK_ICD_FILENAMES=$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json
    #     cargo test --verbose --features event-loop -- --test-threads=1

    - name: Build no-event-loop
      run: cargo build --verbose --features no-event-loop --example manual
    - name: Run tests no-event-loop
      run: |
        export DYLD_LIBRARY_PATH=$(brew --prefix molten-vk)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}
        export VK_ICD_FILENAMES=$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json
        cargo test --verbose --features no-event-loop -- --test-threads=1


